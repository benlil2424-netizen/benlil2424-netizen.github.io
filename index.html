*{
  box-sizing:border-box
}
html,body{
  margin:0;
  padding:0
}
body{
  font-family:"Jost",system-ui,sans-serif;
  color:var(--ink);
  background:var(--surface)
}
.font-serif-romantic{
  font-family:"Cormorant Garamond",Georgia,serif
}
@keyframes floatHeart{
  0%{
    transform:translateY(0) rotate(-8deg) scale(.8);
    opacity:0
  }
  10%{
    opacity:.55
  }
  90%{
    opacity:.4
  }
  100%{
    transform:translateY(-108vh) rotate(18deg) scale(1.15);
    opacity:0
  }
}
@keyframes fallHeart{
  0%{
    transform:translateY(-8vh) rotate(-20deg);
    opacity:0
  }
  12%{
    opacity:1
  }
  100%{
    transform:translateY(108vh) rotate(55deg);
    opacity:.9
  }
}
@keyframes pulseHeart{
  0%,100%{
    transform:scale(1)
  }
  25%{
    transform:scale(1.12)
  }
  45%{
    transform:scale(.96)
  }
  65%{
    transform:scale(1.1)
  }
}
@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.98)
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}
@keyframes glowPulse{
  0%,100%{
    box-shadow:0 18px 45px rgba(214,51,108,.28)
  }
  50%{
    box-shadow:0 22px 60px rgba(214,51,108,.45)
  }
}
@keyframes sparkle{
  0%,100%{
    transform:scale(.7);
    opacity:.4
  }
  50%{
    transform:scale(1.25);
    opacity:1
  }
}
@keyframes eyeGlow{
  0%,100%{
    transform:scale(1);
    filter:brightness(1)
  }
  50%{
    transform:scale(1.04);
    filter:brightness(1.22)
  }
}
@keyframes twinkle{
  0%,100%{
    transform:scale(.55) rotate(0deg);
    opacity:.35
  }
  50%{
    transform:scale(1.2) rotate(20deg);
    opacity:1
  }
}
@keyframes shineSweep{
  0%{
    transform:translateX(-45%) skewX(-18deg);
    opacity:0
  }
  18%{
    opacity:.65
  }
  55%{
    transform:translateX(125%) skewX(-18deg);
    opacity:0
  }
  100%{
    transform:translateX(125%) skewX(-18deg);
    opacity:0
  }
}
.eye-shine{
  animation:eyeGlow 3.2s ease-in-out infinite
}
.sparkle-dot{
  position:absolute;
  border-radius:9999px;
  background:#fff;
  box-shadow:0 0 12px 3px rgba(255,255,255,.9);
  animation:twinkle 2.4s ease-in-out infinite
}
.shine-sweep::after{
  content:"";
  position:absolute;
  top:-20%;
  bottom:-20%;
  left:0;
  width:28%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shineSweep 7s ease-in-out infinite
}
.rise{
  animation:riseIn .65s cubic-bezier(.2,.8,.2,1) both
}
.rise-1{
  animation-delay:.08s
}
.rise-2{
  animation-delay:.16s
}
.rise-3{
  animation-delay:.24s
}
.rise-4{
  animation-delay:.32s
}
.rise-5{
  animation-delay:.42s
}
.heart-pulse{
  animation:pulseHeart 1.8s ease-in-out infinite
}
.glow-button{
  animation:glowPulse 2.4s ease-in-out infinite
}
input:focus{
  outline:2px solid var(--primary);
  outline-offset:2px
}
button:focus-visible{
  outline:3px solid #fff;
  outline-offset:3px;

}
